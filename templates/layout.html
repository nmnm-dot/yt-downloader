<!DOCTYPE html>
<html lang="ar" style="--vh: 7.04px;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>{{title}}</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/jquery-ui-slider.css">
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/static/css/extra.css">
    <link rel="icon" href="/static/img/logo.png" type="image/png">
    <script defer src="/static/js/app.js"></script>
</head>
<body class="page-container">
<div class="container-fluid mb-3">
    <nav class="navbar navbar-expand-lg py-1">
        <div class="d-flex align-items-center flex-grow-1">
            
                <a id="youtlogo" href="/" class="me-2">
                    <img style="height: 40px;" src="/static/img/logo.png" alt="Yout" width="72" height="40">
                </a>
            
            
                <form class="form-inline flex-grow-1 me-2" action="/s/" method="GET" style="max-width: 480px">
                    <label for="blah" class="d-none">يبحث</label>
                    <input name="q" id="blah" class="form-control rounded-pill border-0 auto-suggest" type="search" placeholder="لصق عنوان URL أو البحث" autocomplete="off" required="">
                    <div class="auto-suggest-list m-0 empty"></div>
                </form>
            
            <div class="ms-auto d-flex align-items-center gap-2">
                
                <button id="togglebutton" class="custom-toggler navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarTogglerDemo02" aria-controls="navbarTogglerDemo02" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
            
                <a class="flex-shrink-0 btn btn-warning rounded-pill d-lg-none ms-2" href="/downloads/">التحميلات</a>
            
        </div>
        <div class="collapse navbar-collapse flex-shrink-0 flex-grow-0" id="navbarTogglerDemo02">
            <ul id="mainMenu" class="navbar-nav ms-auto text-center">
                <li class="nav-item">
                    <a class="text-light nav-link" aria-current="page" href="/">Yout</a>
                </li>
                <li class="nav-item">
                    <a class="text-light nav-link" aria-current="page" href="/api/">API</a>
                </li>
                <li class="nav-item">
                    <a class="btn btn-warning rounded-pill" href="/downloads/">التحميلات</a>
                </li>
            </ul>
        </div>
    </nav>
</div>

    
    

    
{{content}}

<div class="container text-center pt-5">
    <p>
        <a class="text-light mx-1 text-decoration-none" href="/api/">API</a>
        <a class="text-light mx-1 text-decoration-none" href="/downloads/">التحميلات</a>
        <a class="text-light mx-1 text-decoration-none" href="https://github.com/yt-dlp/yt-dlp" target="_blank" rel="noopener">yt-dlp</a>
    </p>
</div>


</body>
</html>
